# cms-auth.redactplus.io — STAGE 2 (final): HTTPS reverse proxy to the CMS login broker.
#
# Install as /etc/nginx/sites-available/cms-auth.redactplus.io, replacing the bootstrap
# file, only after /etc/letsencrypt/live/cms-auth.redactplus.io/ exists.
# Upstream: 127.0.0.1:6097 (container port 8787, loopback-bound, plain HTTP: this server
# block is where TLS ends, per OAUTH_TLS_TERMINATION=proxy in compose.yaml).
#
# Two requirements from services/cms-oauth-broker/SECURITY.md are met here:
#   - request-volume control: limit_req below;
#   - no codes in logs: /callback carries the one-time authorization code and state in its
#     query string, so the access log records the path only ($uri, never $request or
#     $args), no cookies and no referrer, and the error log is kept at crit, the level at
#     which nginx stops writing request lines.
#
# Every http-level name is prefixed redactplus_cms_auth: they are global to the http block.

limit_req_zone $binary_remote_addr zone=redactplus_cms_auth:1m rate=20r/m;

log_format redactplus_cms_auth '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name cms-auth.redactplus.io;

    server_tokens off;
    access_log /var/log/nginx/cms-auth.access.log redactplus_cms_auth;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://cms-auth.redactplus.io$uri;
    }
}

server {
    listen 443 ssl http2;
    server_name cms-auth.redactplus.io;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/cms-auth.redactplus.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms-auth.redactplus.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The visitor's address from CF-Connecting-IP when Cloudflare proxies the name, so
    # the rate limit is per person rather than per Cloudflare edge.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    access_log /var/log/nginx/cms-auth.access.log redactplus_cms_auth;
    error_log  /var/log/nginx/cms-auth.error.log crit;

    # Only GET /auth, /callback and /health exist; nothing is uploaded.
    client_max_body_size 1k;

    add_header Strict-Transport-Security "max-age=86400" always;

    # A login is two requests (/auth, then /callback); 20 a minute with a small burst
    # leaves room for retries and refuses scripted volume.
    limit_req zone=redactplus_cms_auth burst=10 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:6097;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        # Responses are per-login and marked no-store by the broker; never cache them.
        proxy_buffering off;
        proxy_cache off;
    }
}
