# Decap CMS GitHub login broker (services/cms-oauth-broker): Compose template for
# /root/deploy/redactplus-cms-oauth/. Installed beside two things that are never committed:
#   broker.env  secrets and settings, mode 600;  see broker.env.example
#   app/        the broker source of one exact commit, exported by package-broker.sh
#
# The broker has no runtime dependencies, so it runs on the same pinned Node image the
# marketing site builds from, with its source mounted read-only: no registry image to
# build or push. Changing the broker means exporting a new commit into app/ and
# `docker compose up -d` (README.md).
#
# Exactly one container: the broker keeps its OAuth transactions in memory, so a second
# replica or a restart mid-login fails that login (services/cms-oauth-broker/SECURITY.md).
name: redactplus-cms-oauth

services:
  cms-oauth-broker:
    container_name: redactplus-cms-oauth
    image: "node:22.23.4-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da"
    pull_policy: missing
    restart: unless-stopped
    init: true
    user: node
    working_dir: /app
    command: ["node", "src/start.mjs"]

    env_file:
      - path: ./broker.env
        required: true
    environment:
      NODE_ENV: production
      # Host nginx terminates HTTPS for cms-auth.redactplus.io and forwards over loopback.
      OAUTH_TLS_TERMINATION: proxy
      OAUTH_BIND_HOST: 0.0.0.0
      OAUTH_PORT: "8787"

    volumes:
      - ./app:/app:ro

    # Loopback only. Host nginx is the sole public path to the container.
    ports:
      - "127.0.0.1:6097:8787"

    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
          pids: 64

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # The broker logs only an event name, outcome and a random correlation id.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    labels:
      com.centurylinklabs.watchtower.enable: "false"
      io.safaridesk.service: redactplus-cms-oauth

    networks:
      - cms-oauth

networks:
  cms-oauth:
    name: redactplus-cms-oauth
