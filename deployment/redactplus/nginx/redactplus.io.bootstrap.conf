# redactplus.io — STAGE 1 (bootstrap): HTTP only, for certificate issuance.
#
# Install as /etc/nginx/sites-available/redactplus.io and enable only after DNS for
# both names resolves to 31.97.42.73. References no certificate files, so it is valid
# before the certificate exists. Replaced by redactplus.io.conf once issued.
#
# Exact server_name and no default_server: it can never answer for another domain.

server {
    listen 80;
    server_name redactplus.io www.redactplus.io;

    server_tokens off;

    # Certbot (--webroot) writes HTTP-01 challenges here, as for the existing sites.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # Nothing else is served until TLS is in place. The application's policy carries
    # upgrade-insecure-requests, so proxying it over plain HTTP would render broken.
    location / {
        add_header Retry-After 600 always;
        return 503;
    }
}
