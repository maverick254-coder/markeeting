# home.redactplus.io, STAFF PREVIEW: the real portal for listed staff addresses only.
# Install as /etc/nginx/sites-available/home.redactplus.io between the holding page and public
# launch (DEPLOYMENT.md stage H2), after adding the staff addresses to the
# $redactplus_portal_staff geo block in /etc/nginx/conf.d/redactplus-portal-http.conf.
# Identical to home.redactplus.io.conf except for the staff check in the HTTPS block.
#
# Needs the same shared files as home.redactplus.io.conf.

server {
    listen 80;
    server_name home.redactplus.io;
    server_tokens off;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    # Only Cloudflare may reach this origin by name (see redactplus-portal-http.conf).
    if ($redactplus_portal_via_cloudflare = 0) { return 403; }

    # Certificate renewal (webroot, as for redactplus.io and admin.redactplus.io).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://home.redactplus.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name home.redactplus.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/home.redactplus.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.redactplus.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    if ($redactplus_portal_via_cloudflare = 0) { return 403; }

    # STAFF PREVIEW: only addresses listed in $redactplus_portal_staff (redactplus-portal-http.conf)
    # reach the portal; everyone else gets the holding answer. $remote_addr is already the
    # visitor's address here (real-IP runs before this check).
    if ($redactplus_portal_staff = 0) { return 503; }
    error_page 503 = @holding;
    location @holding {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "86400" always;
        return 503 "The RedactPlus customer portal is not open yet. Contact support@redactplus.io.\n";
    }

    # /auth/callback carries a one-time code in its query string. Codes are single use and
    # expire within a minute, but they are still kept out of the access log.
    access_log /var/log/nginx/redactplus-portal.access.log redactplus_portal_noquery;
    error_log  /var/log/nginx/redactplus-portal.error.log warn;

    # The portal accepts no uploads. Small bodies and short client timeouts.
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Development-only assets never exist in the production image; refuse them anyway.
    location ^~ /dev-fixtures/ { return 404; }

    # Sign-in endpoints: a per-address ceiling in front of the application's own limit.
    location ^~ /auth/ {
        limit_req zone=redactplus_portal_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:6096;
        include /etc/nginx/snippets/redactplus-portal-proxy.conf;
        # Every portal response except hashed static assets is private: Cloudflare and any
        # other shared cache must never store it, whatever the application sent.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    # Content-hashed build assets: the application marks them immutable; keep its header.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:6096;
        include /etc/nginx/snippets/redactplus-portal-proxy.conf;
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    location / {
        proxy_pass http://127.0.0.1:6096;
        include /etc/nginx/snippets/redactplus-portal-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, max-age=0" always;
        # Start low, as the marketing site did; raise after the first stable week.
        add_header Strict-Transport-Security "max-age=86400" always;
    }
}
