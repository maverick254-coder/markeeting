# cms-auth.redactplus.io — STAGE 1 (bootstrap): HTTP only, for certificate issuance.
#
# Install as /etc/nginx/sites-available/cms-auth.redactplus.io and enable only after DNS
# for the name resolves to this server. References no certificate files, so it is valid
# before the certificate exists. Replaced by cms-auth.redactplus.io.conf once issued.

server {
    listen 80;
    server_name cms-auth.redactplus.io;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 600 always;
        return 503;
    }
}
