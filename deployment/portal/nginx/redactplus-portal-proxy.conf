# /etc/nginx/snippets/redactplus-portal-proxy.conf: included by every portal location.
#
# X-Forwarded-For is OVERWRITTEN, never appended: after cloudflare-real-ip.conf,
# $remote_addr is the visitor's address as Cloudflare reported it, and a value the visitor
# supplied themselves is discarded. The portal trusts exactly one hop (TRUST_PROXY_HOPS=1).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
# Not forwarded: the application has no use for them, and they could be mistaken for trusted.
proxy_set_header CF-Connecting-IP  "";
proxy_set_header True-Client-IP    "";
proxy_set_header Forwarded         "";
# Plain request/response traffic only; the portal opens no WebSockets in production.
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

proxy_hide_header X-Powered-By;
