# home.redactplus.io, HOLDING: the certificate exists, the portal is NOT public yet.
# Install as /etc/nginx/sites-available/home.redactplus.io after certbot succeeds and keep it
# until the production identity client is issued and tested (DEPLOYMENT.md steps 6 and 10).
#
# The name gets its own certificate and a plain 503, instead of falling through to the
# admin.redactplus.io block (wrong certificate, which Full (strict) rejects). Nothing is
# proxied: the portal container, if running, stays reachable only on 127.0.0.1:6096.
server {
    listen 80;
    server_name home.redactplus.io;
    server_tokens off;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    if ($redactplus_portal_via_cloudflare = 0) { return 403; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://home.redactplus.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name home.redactplus.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/home.redactplus.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.redactplus.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    if ($redactplus_portal_via_cloudflare = 0) { return 403; }

    access_log /var/log/nginx/redactplus-portal.access.log redactplus_portal_noquery;
    error_log  /var/log/nginx/redactplus-portal.error.log warn;

    location / {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "86400" always;
        return 503 "The RedactPlus customer portal is not open yet. Contact support@redactplus.io.\n";
    }
}
