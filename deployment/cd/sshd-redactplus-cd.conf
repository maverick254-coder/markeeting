# /etc/ssh/sshd_config.d/90-redactplus-cd.conf: limits for the GitHub Actions deploy user.
#
# A second, independent fence behind the authorized_keys options: even if the key line lost
# `restrict,command=…`, sshd still forces the deploy command and allows no TTY or forwarding.
# The key itself lives in a root-owned file the user cannot change.
#
# Install by hand (back up first), then check before reloading:
#   sshd -t
#   sshd -T -C user=redactplus-cd,host=github,addr=192.0.2.1 | grep -Ei 'forcecommand|permittty|authenticationmethods'
#   sshd -T -C user=root,host=github,addr=192.0.2.1 | grep -Ei 'forcecommand|permittty'   # unchanged for root
#   systemctl reload ssh
Match User redactplus-cd
    AuthenticationMethods publickey
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u
    ForceCommand /usr/local/sbin/redactplus-deploy-ssh
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    GatewayPorts no
