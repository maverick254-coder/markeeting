# Continuous integration for the marketing site (repository root) and the customer portal
# (apps/portal). Runs on every pull request into main, every push to main (so main shows its own
# checks), the merge queue if it is enabled, and by hand.
#
# The five checks need no secrets and have read-only permissions: nothing in them can reach
# production, the image registry or the server, and the images they build are never pushed.
#
# Deployment is the separate workflow .github/workflows/deploy-production.yml. The last job below
# calls it ONLY for a push to main, and only after every check passed for that exact commit. Its
# secrets live in the "production" environment (main branch only), and it does nothing until
# CD_ENABLED is "true" (docs/ci/README.md, "Automatic deployment").
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  marketing:
    name: marketing / verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMS_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/cms-oauth-broker/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix services/cms-oauth-broker ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      # Default settings only: no portal URL (so no Download dialog), no lead delivery. The route
      # suite serves this build, so it must be the production default.
      - name: Production build (content is validated first, by prebuild)
        run: npm run build
      - name: Regression suites (static, content, routes, OAuth broker)
        run: npm test
      - name: Changed-line whitespace
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) git diff --check "$BASE_SHA...HEAD" ;;
            push) [[ "$BEFORE_SHA" =~ ^0+$ ]] || git diff --check "$BEFORE_SHA" HEAD ;;
            *) git diff --check HEAD^ HEAD ;;
          esac

  portal:
    name: portal / verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/portal
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build (validates content/releases.json first)
        run: npm run build
      # Route tests start the development identity provider (public-client mode) and the
      # /portal/me stand-in on loopback; both refuse NODE_ENV=production.
      - name: Unit and route tests
        run: npm test
      # The forum bridge's pure logic (identity parsing, key check, error mapping, queries).
      - name: Forum bridge unit tests
        working-directory: services/forum-bridge
        run: node --test test/unit.test.js

  images:
    name: images / build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js (smoke test)
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      # Builds both production images exactly as releases do, and pushes nothing. The marketing
      # script exports the commit with git archive and checks the runtime tree inside the image.
      - name: Marketing image (default settings, no portal URL)
        run: bash deployment/redactplus/scripts/build-image.sh "$GITHUB_SHA"
      # The documented smoke test (deployment/redactplus/README.md): the read-only container on
      # loopback with the placeholder app.env, then GET/HEAD checks only.
      - name: Marketing image smoke test
        run: |
          image="registry.safaridesk.io/safari/redactplus-landing:${GITHUB_SHA}"
          docker run --rm -d --name redactplus-smoke -p 127.0.0.1:3095:3000 --read-only \
            --tmpfs /tmp --tmpfs /app/.next/cache:mode=1777 --tmpfs /app/.next/server/route-cache:mode=1777 \
            --env-file deployment/redactplus/app.env.example "$image"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3095/api/health >/dev/null 2>&1 && break; sleep 2; done
          EXPECT_CANONICAL_ORIGIN=https://redactplus.io node deployment/redactplus/scripts/smoke-test.mjs http://127.0.0.1:3095 "$GITHUB_SHA"
      - name: Stop the smoke-test container
        if: always()
        run: docker rm -f redactplus-smoke >/dev/null 2>&1 || true
      - name: Portal image
        run: |
          docker build --platform linux/amd64 \
            -f deployment/portal/Dockerfile \
            --build-arg GIT_COMMIT="$GITHUB_SHA" \
            -t "registry.safaridesk.io/safari/redactplus-portal:${GITHUB_SHA}" apps/portal
      # The forum backend image (NodeBB + the RedactPlus bridge), built as a release would, then
      # run read-only against a throwaway PostgreSQL and checked with the bridge's integration
      # test (real NodeBB, real posting delays) and a restart. Every secret is made for this run.
      - name: Forum image
        run: |
          docker build --platform linux/amd64 \
            -f deployment/forum/Dockerfile \
            --build-arg GIT_COMMIT="$GITHUB_SHA" \
            -t "registry.safaridesk.io/safari/redactplus-forum:${GITHUB_SHA}" .
      - name: Forum image integration test
        run: |
          set -eu
          key=$(openssl rand -hex 32)
          dbpass=$(openssl rand -hex 24)
          mkdir -p "$RUNNER_TEMP/forum"
          openssl rand -hex 16 > "$RUNNER_TEMP/forum/admin-password"
          chmod 644 "$RUNNER_TEMP/forum/admin-password"
          healthy() {
            for i in $(seq 1 90); do
              [ "$(docker inspect --format '{{.State.Health.Status}}' forum-ci)" = healthy ] && return 0
              sleep 2
            done
            return 1
          }
          docker network create forum-ci
          docker run -d --name forum-ci-db --network forum-ci \
            -e POSTGRES_DB=forum -e POSTGRES_USER=forum -e POSTGRES_PASSWORD="$dbpass" \
            postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
          for i in $(seq 1 30); do docker exec forum-ci-db pg_isready -U forum -d forum -q && break; sleep 2; done
          docker run -d --name forum-ci --network forum-ci -p 127.0.0.1:4567:4567 --read-only \
            --tmpfs /tmp --tmpfs /run/nodebb:uid=1000,gid=1000,mode=700 \
            -v forum-ci-uploads:/usr/src/app/public/uploads \
            -v "$RUNNER_TEMP/forum/admin-password:/run/secrets/admin-password:ro" \
            -e FORUM_URL=http://localhost:4567 -e FORUM_SECRET="$(openssl rand -hex 24)" \
            -e REDACTPLUS_BRIDGE_KEY="$key" -e FORUM_DATABASE=postgres -e FORUM_DB_HOST=forum-ci-db \
            -e FORUM_DB_NAME=forum -e FORUM_DB_USER=forum -e FORUM_DB_PASSWORD="$dbpass" \
            -e FORUM_ADMIN_USERNAME=ci-admin -e FORUM_ADMIN_EMAIL=ci-admin@forum.test \
            -e FORUM_ADMIN_PASSWORD_FILE=/run/secrets/admin-password \
            "registry.safaridesk.io/safari/redactplus-forum:${GITHUB_SHA}"
          healthy
          FORUM_BRIDGE_URL=http://127.0.0.1:4567 FORUM_BRIDGE_KEY="$key" node services/forum-bridge/test/integration.mjs
          docker restart forum-ci
          healthy
          FORUM_BRIDGE_URL=http://127.0.0.1:4567 FORUM_BRIDGE_KEY="$key" node services/forum-bridge/test/integration.mjs --verify-persisted
      - name: Forum container logs
        if: failure()
        run: docker logs --tail 200 forum-ci 2>&1 || true
      - name: Remove the forum test containers
        if: always()
        run: |
          docker rm -f forum-ci forum-ci-db >/dev/null 2>&1 || true
          docker volume rm forum-ci-uploads >/dev/null 2>&1 || true
          docker network rm forum-ci >/dev/null 2>&1 || true

  secrets:
    name: security / secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      - name: Repository secret-pattern policy (tracked files)
        run: npm run check:secrets
      # gitleaks, pinned by version AND checksum. --redact keeps any match out of the log.
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan the commits this change adds
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE_SHA..HEAD" ;;
            push) if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then range="HEAD~1..HEAD"; else range="$BEFORE_SHA..HEAD"; fi ;;
            *) range="HEAD~1..HEAD" ;;
          esac
          /tmp/gitleaks git --redact --no-banner --exit-code 1 --log-opts="$range" .

  dependencies:
    name: security / dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      # Runtime dependencies (what ships in the images): any advisory fails.
      - name: Production dependency audit
        run: |
          npm audit --omit=dev --audit-level=low
          npm --prefix apps/portal audit --omit=dev --audit-level=low
          npm --prefix services/cms-oauth-broker audit --omit=dev --audit-level=low
      # Build and test tooling: high or critical fails; moderate is reported only. On 6 Nov 2026
      # there were moderate advisories in ESLint's TypeScript plugins (minimatch) and Tailwind's
      # postcss-selector-parser, none in runtime code.
      - name: Full dependency audit (development tooling)
        run: |
          npm audit --audit-level=high
          npm --prefix apps/portal audit --audit-level=high
          npm --prefix services/cms-oauth-broker audit --audit-level=high

  deploy:
    name: deploy / production
    needs: [marketing, portal, images, secrets, dependencies]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Safe-Redact/Marketing-Site'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-production.yml
