# home.redactplus.io, BOOTSTRAP ONLY: port 80 for the first certificate.
# Install as /etc/nginx/sites-available/home.redactplus.io (symlinked into sites-enabled),
# run certbot, then replace it with home.redactplus.io.conf. See DEPLOYMENT.md steps 4-6.
#
# Today, without any block for this name, port 80 falls through to the first server block
# nginx loaded (admin.redactplus.io), which redirects to admin. This block claims the name
# so the ACME challenge is answered here and nothing else is.
server {
    listen 80;
    server_name home.redactplus.io;
    server_tokens off;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    if ($redactplus_portal_via_cloudflare = 0) { return 403; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
