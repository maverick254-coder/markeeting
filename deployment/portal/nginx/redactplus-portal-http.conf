# /etc/nginx/conf.d/redactplus-portal-http.conf: http-level definitions used only by the
# home.redactplus.io server blocks. Every name is prefixed redactplus_portal_ so nothing
# collides with, or changes, another site on this server.

# Sign-in endpoints (/auth/*): 20 requests a minute per visitor address, with a burst of 10.
# Keyed on the real client address (cloudflare-real-ip.conf runs first).
limit_req_zone $binary_remote_addr zone=redactplus_portal_auth:10m rate=20r/m;

# Access log without query strings: /auth/callback carries a one-time code.
log_format redactplus_portal_noquery '$remote_addr - [$time_local] "$request_method $uri" '
                                     '$status $body_bytes_sent "$http_user_agent" cf=$realip_remote_addr';

# 1 when the TCP peer (before the real-IP rewrite) is Cloudflare. The portal server blocks
# answer 403 otherwise, so the origin cannot be used to bypass Cloudflare by name.
# Keep in step with cloudflare-real-ip.conf (same source, same date: 2026-11-06).
geo $realip_remote_addr $redactplus_portal_via_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Staff preview (home.redactplus.io.preview.conf only): visitor addresses allowed to reach the
# portal before public launch. Keyed on the real visitor address (after the Cloudflare real-IP
# rewrite). Empty means nobody; add one line per staff address, e.g. "203.0.113.10 1;".
geo $redactplus_portal_staff {
    default 0;
}
