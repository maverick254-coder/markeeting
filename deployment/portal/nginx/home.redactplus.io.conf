# home.redactplus.io -> RedactPlus customer portal on 127.0.0.1:6096.
# FILES ONLY — not installed. Needs the DNS record and a certificate first (../README.md).
#
# Requires, once, in the http block (e.g. /etc/nginx/conf.d/redactplus-portal-limits.conf):
#   limit_req_zone $binary_remote_addr zone=redactplus_portal_auth:10m rate=20r/m;

server {
    listen 80;
    server_name home.redactplus.io;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://home.redactplus.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name home.redactplus.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/home.redactplus.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.redactplus.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Start low, as the marketing site did; raise after the first stable week.
    add_header Strict-Transport-Security "max-age=86400" always;

    # /auth/callback carries a one-time code in its query string. Codes are single use and
    # expire within a minute, but they are still kept out of the access log.
    access_log /var/log/nginx/redactplus-portal.access.log redactplus_portal_noquery;
    error_log  /var/log/nginx/redactplus-portal.error.log warn;

    client_max_body_size 64k;

    # Sign-in endpoints: a per-address ceiling in front of the application's own limit.
    location ^~ /auth/ {
        limit_req zone=redactplus_portal_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:6096;
        include /etc/nginx/snippets/redactplus-portal-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:6096;
        include /etc/nginx/snippets/redactplus-portal-proxy.conf;
    }
}

# Also in the http block:
#   log_format redactplus_portal_noquery '$remote_addr - [$time_local] "$request_method $uri" '
#                                        '$status $body_bytes_sent "$http_user_agent"';
