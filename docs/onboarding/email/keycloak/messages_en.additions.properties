# RedactPlus: proposed changes to ops/keycloak/themes/saferedact/email/messages/messages_en.properties
# (Admin-panel). FOR THE BACKEND TEAM. Nothing here is applied by the Marketing-Site repository.
#
# Keycloak takes the subject of every execute-actions email from this one key, realm-wide.
# It cannot differ between website registrations and Control Center invitations, so the
# proposed subject works for both.
executeActionsSubject=Welcome to RedactPlus — Set Up Your Account

# The footer contact currently points at admin@saferedact.io. Customer mail should name the
# RedactPlus support mailbox.
emailFooterContact=support@redactplus.io

# The footer's legal links and company details are reused by executeActions.ftl:
#   emailFooterCompany, emailFooterAddress, emailFooterPrivacyUrl, emailFooterTermsUrl
# BEFORE THE FIRST CUSTOMER EMAIL: emailFooterCompany/emailFooterAddress must carry the registered
# entity, and the Privacy and Terms pages must have their [bracketed] fields completed.
