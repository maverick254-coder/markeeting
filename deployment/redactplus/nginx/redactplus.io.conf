# redactplus.io — STAGE 2 (final): HTTPS reverse proxy to the RedactPlus container.
#
# Install as /etc/nginx/sites-available/redactplus.io, replacing the bootstrap file,
# only after /etc/letsencrypt/live/redactplus.io/ exists. Canonical host: redactplus.io.
# Upstream: 127.0.0.1:6095 (container port 3000, loopback-bound).
#
# Every map variable is prefixed redactplus_: map variables are global to the http
# block, and another site on this host already defines $connection_upgrade.

# Only forward Connection: upgrade when the client asked for one. The site does not
# use WebSockets today; this keeps any future upgrade working without forcing the
# header onto every request.
map $http_upgrade $redactplus_connection_upgrade {
    default upgrade;
    ''      close;
}

# Fallback response headers, added only when the application did not send its own,
# so no header is ever duplicated. nginx omits a header whose value is empty.
map $upstream_http_x_content_type_options $redactplus_x_content_type_options {
    ''      nosniff;
    default '';
}
map $upstream_http_referrer_policy $redactplus_referrer_policy {
    ''      strict-origin-when-cross-origin;
    default '';
}

# --- HTTP: ACME renewals, everything else to the canonical HTTPS host -------------
server {
    listen 80;
    server_name redactplus.io www.redactplus.io;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://redactplus.io$request_uri;
    }
}

# --- HTTPS www: redirect to the apex ----------------------------------------------
server {
    listen 443 ssl http2;
    server_name www.redactplus.io;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/redactplus.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redactplus.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=86400" always;

    return 301 https://redactplus.io$request_uri;
}

# --- HTTPS apex: the site ---------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name redactplus.io;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/redactplus.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redactplus.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The visitor's address from CF-Connecting-IP, trusted only when the TCP peer is one of
    # Cloudflare's published ranges (deployment/shared/nginx/cloudflare-real-ip.conf). Without
    # it every visitor appears as a Cloudflare edge address, and the per-client enquiry rate
    # limit is shared by everyone behind the same edge. X-Forwarded-For below then carries
    # the real visitor address, so TRUST_PROXY_HOPS=1 stays correct.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    access_log /var/log/nginx/redactplus.access.log;
    error_log  /var/log/nginx/redactplus.error.log warn;

    # Enquiry and comment payloads are small JSON; the application enforces its own,
    # tighter limits. Nothing on this site accepts uploads.
    client_max_body_size 1m;

    # The application owns Content-Security-Policy (a fresh nonce per request), the
    # /admin framing headers and Cache-Control. nginx adds only what it never sends.
    # HSTS starts at one day; raise to 31536000 once the site is stable (DEPLOYMENT.md).
    # add_header is declared here only: any add_header inside a location would stop
    # these from being inherited.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options $redactplus_x_content_type_options always;
    add_header Referrer-Policy $redactplus_referrer_policy always;

    location / {
        proxy_pass http://127.0.0.1:6095;
        proxy_http_version 1.1;

        # Repeated per location by design: a location that sets any proxy_set_header
        # inherits none from the server block.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        # Overwritten, not appended: the application trusts exactly one hop
        # (TRUST_PROXY_HOPS=1), so a visitor-supplied value must never survive.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $redactplus_connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Pages are streamed (React Suspense), so they pass through unbuffered, as the
        # Next.js self-hosting guidance recommends for nginx. Nothing is cached either:
        # pages are rendered per request around a CSP nonce, and Next already marks
        # /_next/static as immutable and /_next/image with its own TTL.
        proxy_buffering off;
        # Still used for response headers; nginx requires busy < total buffers.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        proxy_hide_header X-Powered-By;
    }
}
